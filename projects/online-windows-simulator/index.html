<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Windows Simulator</title>
  <style>
    :root {
      --accent: #0078d4;
      --taskbar: rgba(25, 25, 25, 0.92);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0879c9, #36a9e1 48%, #0a5fa8);
      color: #fff;
      user-select: none;
    }

    .desktop {
      width: 100%;
      height: 100%;
      position: relative;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.15), transparent 28%),
        linear-gradient(135deg, #075da7, #21a1dd 50%, #063d82);
    }

    .icon {
      width: 86px;
      margin: 14px;
      padding: 8px 4px;
      text-align: center;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
    }

    .icon:hover { background: rgba(255,255,255,.15); }
    .icon-symbol { font-size: 34px; display: block; margin-bottom: 5px; }
    .window {
      display: none;
      position: absolute;
      width: min(720px, 88vw);
      height: min(500px, 72vh);
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      background: rgba(248,248,248,.97);
      color: #222;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0,0,0,.45);
    }

    .titlebar {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: #f5f5f5;
      border-bottom: 1px solid #ddd;
    }

    .titlebar button {
      width: 42px;
      height: 30px;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
    }

    .titlebar button:hover { background: #e81123; color: white; }
    .content { padding: 22px; height: calc(100% - 42px); overflow: auto; }

    .start {
      display: none;
      position: absolute;
      bottom: 54px;
      left: 10px;
      width: 340px;
      max-width: calc(100vw - 20px);
      background: rgba(30,30,30,.96);
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
    }

    .start h2 { margin: 0 0 14px; }
    .start button {
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      border: 0;
      border-radius: 5px;
      background: #444;
      color: white;
      text-align: left;
      cursor: pointer;
    }
    .start button:hover { background: #555; }

    .taskbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      background: var(--taskbar);
      backdrop-filter: blur(12px);
    }

    .taskbar button {
      height: 40px;
      min-width: 44px;
      margin-right: 4px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 20px;
    }

    .taskbar button:hover { background: rgba(255,255,255,.12); }
    .clock { margin-left: auto; padding: 0 12px; font-size: 13px; }
  </style>
</head>
<body>
  <main class="desktop" id="desktop">
    <div class="icon" onclick="openWindow('aboutWindow')">
      <span class="icon-symbol">💻</span>
      This PC
    </div>

    <div class="icon" onclick="openWindow('aboutWindow')">
      <span class="icon-symbol">🪟</span>
      Windows
    </div>

    <section class="window" id="aboutWindow">
      <div class="titlebar">
        <span>Online Windows Simulator</span>
        <button onclick="closeWindow('aboutWindow')" aria-label="Close">×</button>
      </div>
      <div class="content">
        <h1>Welcome! 👋</h1>
        <p>This is the Online Windows Simulator prototype for TavanTools.</p>
        <p>Everything here runs in your browser — no installation required.</p>
        <hr>
        <p><strong>Status:</strong> 🚧 In Development</p>
      </div>
    </section>

    <section class="start" id="startMenu">
      <h2>Start</h2>
      <button onclick="openWindow('aboutWindow'); toggleStart()">💻 About this simulator</button>
      <button onclick="alert('More apps are coming soon!')">📁 File Explorer</button>
      <button onclick="alert('Settings are coming soon!')">⚙️ Settings</button>
    </section>

    <footer class="taskbar">
      <button onclick="toggleStart()" aria-label="Start">⊞</button>
      <button onclick="openWindow('aboutWindow')" aria-label="Windows Simulator">🪟</button>
      <div class="clock" id="clock"></div>
    </footer>
  </main>

  <script>
    const startMenu = document.getElementById("startMenu");
    const clock = document.getElementById("clock");

    function toggleStart() {
      startMenu.style.display = startMenu.style.display === "block" ? "none" : "block";
    }

    function openWindow(id) {
      document.getElementById(id).style.display = "block";
      startMenu.style.display = "none";
    }

    function closeWindow(id) {
      document.getElementById(id).style.display = "none";
    }

    function updateClock() {
      clock.textContent = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
